<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="52%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1a73e8" />
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="lens" x1="11" y1="11" x2="43" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="sparkle" x1="42" y1="8" x2="56" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75" stroke="url(#rim)" stroke-width="1.5" />

  <!-- Magnifying lens handle -->
  <path d="M39.5 39.5L52.5 52.5" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" />
  <path d="M39.5 39.5L51.5 51.5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Explorer lens body -->
  <circle cx="27" cy="27" r="16.5" fill="#0b132b" fill-opacity="0.55" />
  <circle cx="27" cy="27" r="16.5" stroke="url(#lens)" stroke-width="4.25" />

  <!-- Repository root-up graph inside lens -->
  <path
    d="M21 34V20M21 28.5C21 24.5 25.5 23.5 33 23.5"
    stroke="#e2e8f0"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="21" cy="34" r="3.4" fill="#ffffff" />
  <circle cx="21" cy="20" r="3.4" fill="#38bdf8" />
  <circle cx="33" cy="23.5" r="3.4" fill="#34d399" />

  <!-- Gemini-inspired architect sparkle -->
  <path
    d="M50 7.5C50.45 11.7 52.8 14.05 57 14.5C52.8 14.95 50.45 17.3 50 21.5C49.55 17.3 47.2 14.95 43 14.5C47.2 14.05 49.55 11.7 50 7.5Z"
    fill="url(#sparkle)"
  />
</svg>

